<!doctype html>
<html lang="no" class="light">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/dist/favicon.png" />
        <script>
            // nais.js må lastes fra appens egen origin, ikke fra CDN-bunten, derfor et vanlig inline-script.
            // https://docs.nais.io/explanation/observability/frontend/?h=faro#tracing-opentelemetry
            window.__naisReady = import(/* @vite-ignore */ '/dist/js/nais.js')
                .then((naisModule) => {
                    const faroConfig = naisModule.default;
                    window.nais = faroConfig;
                })
                .catch((error) => {
                    console.error('Failed to load nais.js:', error);
                });
        </script>
    </head>
    <title>K9 Punsj</title>
    <body>
        <div id="appContainer">
            <div id="app"></div>
        </div>
        <script type="module" src="/App.tsx"></script>
    </body>
</html>

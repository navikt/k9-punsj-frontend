compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
    - '@navikt/*'

npmScopes:
    nais:
        npmAlwaysAuth: true
        npmRegistryServer: 'https://npm.pkg.github.com'
    navikt:
        npmAlwaysAuth: true
        npmRegistryServer: 'https://npm.pkg.github.com'

yarnPath: .yarn/releases/yarn-4.12.0.cjs

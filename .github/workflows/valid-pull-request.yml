name: Validere pull request
on:
    pull_request:
        types: [opened, synchronize]

permissions:
    contents: read
    packages: read

jobs:
    lint:
        uses: ./.github/workflows/lint.yml

    test:
        uses: ./.github/workflows/test.yml

    test-cypress:
        uses: ./.github/workflows/cypress-tester.yml
    build:
        uses: ./.github/workflows/build.yml

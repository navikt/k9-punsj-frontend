name: Deploy til preprod gcp
on:
    workflow_dispatch:

permissions:
    contents: read
    packages: read

jobs:
    lint:
        uses: ./.github/workflows/lint.yml
    test:
        uses: ./.github/workflows/test.yml
    build:
        uses: ./.github/workflows/build.yml
    deploy-dev-gcp:
        name: Deploye til DEV GCP
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
            id-token: write
        needs: [lint, test, build]
        steps:
            - name: Hente kode
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Sette opp Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 22.22.3
                  registry-url: https://npm.pkg.github.com/
                  scope: '@navikt'
            - name: Configure Yarn for GitHub Packages
              uses: ./.github/actions/configure-yarn
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: dist
                  path: ./dist

            - name: Last opp nettleserfiler til CDN
              uses: nais/deploy/actions/cdn-upload/v2@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # v2
              with:
                  team: k9saksbehandling
                  source: dist/js
                  destination: /k9-punsj-frontend/dist
                  source_keep_parent_name: true

            - name: Installere moduler
              run: yarn workspaces focus @k9-punsj-frontend/server --production
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - uses: nais/docker-build-push@bfe52e3ad6d0e96fd1056a03acb7b619aaffb39d # v0
              id: docker-push
              with:
                  tag: 'latest'
                  team: k9saksbehandling
                  project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
                  identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
                  pull: true
                  build_args: |
                    CACHEBUST=${{ github.run_id }}
                  cache_from: type=gha
                  cache_to: type=gha,mode=max

            - name: Set image
              run: echo "IMAGE=${{steps.docker-push.outputs.image}}" >> $GITHUB_ENV

            - name: Deploye til dev
              uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # v2
              env:
                  CLUSTER: dev-gcp
                  RESOURCE: nais/k9-punsj-frontend.yml
                  VARS: nais/dev-gcp.yml

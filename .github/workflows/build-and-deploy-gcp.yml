name: Build and deploy to prod gcp
on:
    push:
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENCE'
            - 'CODEOWNERS'
            - 'nais/proxy/*'
        branches:
            - master

permissions:
    contents: read
    packages: read

jobs:
    lint:
        uses: ./.github/workflows/lint.yml
    test:
        uses: ./.github/workflows/test.yml
    test-cypress:
        uses: ./.github/workflows/cypress-tester.yml
    build:
        uses: ./.github/workflows/build.yml
    deploy:
        name: Deploye til PROD
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            packages: read
        needs: [lint, test, test-cypress, build]
        outputs:
            image: ${{ steps.docker-push.outputs.image }}
        steps:
            - name: Hente kode
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Sette opp Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26.12.1
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@navikt'

            - name: Configure Yarn for GitHub Packages
              uses: ./.github/actions/configure-yarn
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: ./dist

            - name: Last opp nettleserfiler til CDN
              uses: nais/deploy/actions/cdn-upload/v2@f93637de5533a1bb573f940ceb7527a5b3b0dea0 # v2
              with:
                  team: k9saksbehandling
                  source: dist/js
                  destination: /k9-punsj-frontend/dist
                  source_keep_parent_name: true

            - name: Installere moduler
              run: yarn workspaces focus @k9-punsj-frontend/server --production
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
              id: docker-push
              with:
                  tag: 'latest'
                  team: k9saksbehandling
                  project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
                  identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
                  pull: true
                  build_args: |
                    CACHEBUST=${{ github.run_id }}
                  cache_from: type=gha
                  cache_to: type=gha,mode=max
            - name: Sett image for nais deploy
              run: |
                  echo "IMAGE=${{steps.docker-push.outputs.image}}" >> $GITHUB_OUTPUT
                  echo "IMAGE=${{steps.docker-push.outputs.image}}" >> $GITHUB_ENV

            - name: Deploye til prod gcp
              uses: nais/deploy/actions/deploy@f93637de5533a1bb573f940ceb7527a5b3b0dea0 # v2
              env:
                  CLUSTER: prod-gcp
                  RESOURCE: nais/k9-punsj-frontend.yml
                  VARS: nais/prod-gcp.yml
    trivy:
        needs: [deploy]
        uses: navikt/sif-gha-workflows/.github/workflows/trivy.yml@91170838949ba4132c4442e4a1163a8cbeb6ab24 # main at 2026-09-07
        permissions:
            contents: write
            security-events: write
            actions: read
            id-token: write
        secrets: inherit
        with:
            team: k9saksbehandling
            image: ${{ needs.deploy.outputs.image }}
